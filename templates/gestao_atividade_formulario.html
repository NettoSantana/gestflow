<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/css/dashboard.css"><title>GestFlow - Gestão de Atividades</title></head><body>{% include "partials/sidebar.html" %}<main class="content activity-page">{% set page_title = page_title_value %}{% include "partials/topbar.html" %}<div class="activity-header"><div><span class="page-kicker">Gestão de Atividades</span><h2>Nova atividade</h2><p>Escolha atividade paralela ou serviço vinculado a uma OS.</p></div><a class="btn-light" href="/gestao-atividades/todas">Voltar</a></div>{% if erro %}<div class="form-alert-error">{{ erro }}</div>{% endif %}<form method="post" class="panel activity-form"><div class="gf-form-grid"><label class="full">Título<input name="titulo" required value="{{ atividade.titulo or '' }}"></label><label class="full">Descrição<textarea name="descricao">{{ atividade.descricao or '' }}</textarea></label><label>Tipo<select name="tipo" id="tipo"><option value="paralela" {% if atividade.tipo=='paralela' %}selected{% endif %}>Atividade paralela</option><option value="servico" {% if atividade.tipo=='servico' %}selected{% endif %}>Serviço vinculado à OS</option></select></label><label>Classificação<select name="classificacao"><option value="administrativa">Administrativa</option><option value="comercial">Comercial</option><option value="operacional">Operacional</option></select></label><label>Responsável<select name="responsavel_funcionario_id" required><option value="">Selecione</option>{% for f in funcionarios %}<option value="{{ f.id }}">{{ f.nome }}{% if f.email %} — {{ f.email }}{% endif %}</option>{% endfor %}</select></label><label>Cliente opcional<select name="cliente_id"><option value="">Sem cliente</option>{% for c in clientes %}<option value="{{ c.id }}">{{ c.nome }}</option>{% endfor %}</select></label><label>Orçamento opcional<select name="orcamento_id"><option value="">Sem orçamento</option>{% for o in orcamentos %}<option value="{{ o.id }}" {% if atividade.orcamento_id|string==o.id|string %}selected{% endif %}>{{ o.numero or o.id }} — {{ o.cliente }}</option>{% endfor %}</select></label><label id="os-field">Ordem de Serviço<select name="ordem_servico_id"><option value="">Sem OS</option>{% for o in ordens_servico %}<option value="{{ o.id }}" {% if atividade.ordem_servico_id|string==o.id|string %}selected{% endif %}>{{ o.numero or o.id }} — {{ o.cliente }}</option>{% endfor %}</select></label><label>Data de início<input type="date" name="data_inicio" value="{{ atividade.data_inicio or '' }}"></label><label>Prazo<input type="date" name="data_prazo" value="{{ atividade.data_prazo or '' }}"></label><label>Prioridade<select name="prioridade"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select></label><label>Status<select name="status"><option value="nao_iniciada">Não iniciada</option><option value="em_andamento">Em andamento</option><option value="aguardando">Aguardando</option></select></label><label class="full">Observações<textarea name="observacoes">{{ atividade.observacoes or '' }}</textarea></label></div><div class="form-actions"><a class="btn-light" href="/gestao-atividades/todas">Cancelar</a><button class="btn-primary-green">Salvar e notificar</button></div></form><script>const t=document.getElementById('tipo'),o=document.getElementById('os-field');function tipo(){o.style.display=t.value==='servico'?'flex':'none'}t.addEventListener('change',tipo);tipo();</script></main></body></html>

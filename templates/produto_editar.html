<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTFLOW - Editar Produto</title>
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
    {% include "partials/sidebar.html" %}

<main class="content">
        {% set page_title = 'Editar Produto' %}
        {% include "partials/topbar.html" %}

<section class="panel page-section">
            <div class="panel-header page-header">
                <div>
                    <span class="page-kicker">Cadastros</span>
                    <h3 class="page-title">Editar produto</h3>
                    <p class="page-subtitle">Atualize os dados principais do produto selecionado.</p>
                </div>

                <a href="/produtos/{{ produto.id }}" class="btn-dark">Cancelar edição</a>
            </div>
        </section>

        <section class="panel page-section">
            <div class="panel-header page-header">
                <div>
                    <h3>{{ produto.nome }}</h3>
                    <p class="page-subtitle">Código do produto: {{ produto.id }}</p>
                </div>

                <span class="badge-info">Modo edição</span>
            </div>

            <form action="/produtos/{{ produto.id }}/editar" method="post" class="client-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="produto_nome">Nome do produto</label>
                        <input id="produto_nome" name="produto_nome" type="text" value="{{ produto.nome or '' }}" placeholder="Ex: Cabo flexível 2,5mm" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_codigo">Código interno</label>
                        <input id="produto_codigo" name="produto_codigo" type="text" value="{{ produto.codigo or '' }}" placeholder="Ex: PROD-001" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_categoria">Categoria</label>
                        <select id="produto_categoria" name="produto_categoria" class="form-control">
                            <option value="" {% if not produto.categoria %}selected{% endif %}>Selecione</option>
                            <option value="Material elétrico" {% if produto.categoria == "Material elétrico" %}selected{% endif %}>Material elétrico</option>
                            <option value="Material mecânico" {% if produto.categoria == "Material mecânico" %}selected{% endif %}>Material mecânico</option>
                            <option value="Ferramentas" {% if produto.categoria == "Ferramentas" %}selected{% endif %}>Ferramentas</option>
                            <option value="EPI" {% if produto.categoria == "EPI" %}selected{% endif %}>EPI</option>
                            <option value="Consumíveis" {% if produto.categoria == "Consumíveis" %}selected{% endif %}>Consumíveis</option>
                            <option value="Serviços aplicados" {% if produto.categoria == "Serviços aplicados" %}selected{% endif %}>Serviços aplicados</option>
                            <option value="Outros" {% if produto.categoria == "Outros" %}selected{% endif %}>Outros</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="produto_unidade">Unidade</label>
                        <select id="produto_unidade" name="produto_unidade" class="form-control">
                            <option value="" {% if not produto.unidade %}selected{% endif %}>Selecione</option>
                            <option value="Unidade" {% if produto.unidade == "Unidade" %}selected{% endif %}>Unidade</option>
                            <option value="Peça" {% if produto.unidade == "Peça" %}selected{% endif %}>Peça</option>
                            <option value="Metro" {% if produto.unidade == "Metro" %}selected{% endif %}>Metro</option>
                            <option value="Kg" {% if produto.unidade == "Kg" %}selected{% endif %}>Kg</option>
                            <option value="Litro" {% if produto.unidade == "Litro" %}selected{% endif %}>Litro</option>
                            <option value="Caixa" {% if produto.unidade == "Caixa" %}selected{% endif %}>Caixa</option>
                            <option value="Pacote" {% if produto.unidade == "Pacote" %}selected{% endif %}>Pacote</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="produto_estoque_atual">Estoque atual</label>
                        <input id="produto_estoque_atual" name="produto_estoque_atual" type="text" value="{{ produto.estoque_atual or '' }}" placeholder="Ex: 10" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_estoque_minimo">Estoque mínimo</label>
                        <input id="produto_estoque_minimo" name="produto_estoque_minimo" type="text" value="{{ produto.estoque_minimo or '' }}" placeholder="Ex: 3" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_preco_custo">Preço de custo</label>
                        <input id="produto_preco_custo" name="produto_preco_custo" type="text" value="{{ produto.preco_custo or '' }}" placeholder="Ex: 25,00" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_preco_venda">Preço de venda</label>
                        <input id="produto_preco_venda" name="produto_preco_venda" type="text" value="{{ produto.preco_venda or '' }}" placeholder="Ex: 39,90" class="form-control">
                    </div>

                    <div class="form-group">
                        <label for="produto_status">Status</label>
                        <select id="produto_status" name="produto_status" class="form-control">
                            <option value="ativo" {% if produto.status == "ativo" %}selected{% endif %}>Ativo</option>
                            <option value="inativo" {% if produto.status == "inativo" %}selected{% endif %}>Inativo</option>
                            <option value="pendente" {% if produto.status == "pendente" %}selected{% endif %}>Pendente</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="produto_observacoes">Observações</label>
                        <input id="produto_observacoes" name="produto_observacoes" type="text" value="{{ produto.observacoes or '' }}" placeholder="Ex: Fornecedor, aplicação ou observação" class="form-control">
                    </div>
                </div>

                <div class="form-actions">
                    <a href="/produtos/{{ produto.id }}" class="btn-light">Cancelar</a>
                    <button type="submit" class="btn-primary-green">Salvar Alterações</button>
                </div>
            </form>
        </section>

    </main>

</body>
</html>
